name: CI & Code Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Static Analysis & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, json, pcov
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Environment Setup
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dump Autoload & Package Discover
        run: |
          composer dump-autoload --optimize --no-interaction
          php artisan package:discover --no-interaction

      - name: 1. Code Style Check (Laravel Pint)
        run: vendor/bin/pint --test

      - name: 2. Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: 3. Run Test Suite (PHPUnit / Pest)
        run: php artisan test
